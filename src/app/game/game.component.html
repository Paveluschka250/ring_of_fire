<app-player
  *ngFor="let player of game.players; let i = index"
  [ngStyle]="{ 'top.px': 100 + i * 120 }"
  [name]="player"
  class="player-position"
></app-player>

<div class="field">
  <div class="card-stack">
    <img
      [ngStyle]="{ 'right.px': i * 5 }"
      *ngFor="let card of [0, 1, 2, 3, 4]; let i = index"
      src="/assets/img/cards/card_cover.png"
    />
    <img
      (click)="takeCard()"
      class="top-card"
      style="right: 30px"
      src="/assets/img/cards/card_cover.png"
    />
    <img
      *ngFor="let card of game.playedCards"
      class="played-card"
      src="/assets/img/cards/{{ card }}.png"
    />
    <img
      (click)="takeCard()"
      *ngIf="pickCardAnimation"
      class="pick-card"
      style="right: 30px"
      src="/assets/img/cards/{{ currentCard }}.png"
    />
  </div>
</div>

<button
  mat-fab
  color="primary"
  class="add-button"
>
  <mat-icon>add</mat-icon>
</button>
